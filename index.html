<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>OTA Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: iOS grouped app. Phone portrait = top nav + bottom tab bar; phone landscape + desktop = side rail + multi-column cards. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F7; --fg:#000000; --fg2:rgba(60,60,67,.66); --fg3:rgba(60,60,67,.36);
  --sep:rgba(60,60,67,.16); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --bar:rgba(249,249,249,.78); --scrim:rgba(0,0,0,.34); --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06);
  --blue:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30; --purple:#AF52DE; --teal:#30B0C7; --indigo:#5856D6; --pink:#FF2D55; --yellow:#FFCC00; --brown:#A2845E;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:14px; --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.4,.64,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --fg:#FFFFFF; --fg2:rgba(235,235,245,.64); --fg3:rgba(235,235,245,.34);
  --sep:rgba(84,84,88,.55); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
  --bar:rgba(22,22,24,.74); --scrim:rgba(0,0,0,.55); --shadow:none;
  --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --purple:#BF5AF2; --teal:#40C8E0; --indigo:#5E5CE6; --pink:#FF375F; --yellow:#FFD60A; --brown:#AC8E68;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --fg:#FFFFFF; --fg2:rgba(235,235,245,.64); --fg3:rgba(235,235,245,.34);
  --sep:rgba(84,84,88,.55); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
  --bar:rgba(22,22,24,.74); --scrim:rgba(0,0,0,.55); --shadow:none;
  --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --purple:#BF5AF2; --teal:#40C8E0; --indigo:#5E5CE6; --pink:#FF375F; --yellow:#FFD60A; --brown:#AC8E68;
  color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.42;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;transition:background .35s var(--ease),color .35s var(--ease)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--blue);text-decoration:none}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}

/* ---------- shell ---------- */
.app{min-height:100vh}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 10px}
.navrow{display:flex;align-items:center;gap:10px;min-height:40px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(145deg,var(--blue),var(--indigo));display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:18px;height:18px;stroke:#fff}
.brand h1{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0;white-space:nowrap}
.brand small{display:block;font-size:12px;color:var(--fg2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--blue);background:var(--fill);transition:transform .25s var(--spring),background .2s}
.iconbtn:active{transform:scale(.88);background:var(--fill2)}
.countries{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding-bottom:2px}
.countries::-webkit-scrollbar{display:none}
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;flex:none}
.seg button{position:relative;z-index:1;font-size:13px;font-weight:600;padding:6px 14px;border-radius:7px;white-space:nowrap;transition:color .2s}
.seg .thumb{position:absolute;z-index:0;top:2px;bottom:2px;left:2px;border-radius:7px;background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transition:transform .38s var(--spring),width .38s var(--ease)}
:root[data-theme="dark"] .seg .thumb{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg .thumb{background:#636366}}
.soon{display:flex;gap:6px;align-items:center;flex:none}
.soon span{font-size:12px;color:var(--fg3);background:var(--fill);padding:6px 10px;border-radius:999px;white-space:nowrap}
.soon b{font-size:12px;color:var(--fg2);font-weight:600;white-space:nowrap;margin-left:2px}

.side{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;color:var(--fg2);font-size:12px;font-weight:500;transition:color .2s}
.tab svg{transition:transform .35s var(--spring)}
.tab.on{color:var(--blue)}
.tab.on svg{transform:translateY(-1px) scale(1.08)}
.tab:active svg{transform:scale(.82)}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(84px + env(safe-area-inset-bottom,0px))}
.view{max-width:1180px;margin:0 auto;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.view>*,#xbody,.mapwrap>*{min-width:0}
.crow .chip{white-space:normal}
.view.enter{animation:viewIn .45s var(--ease) both}
@keyframes viewIn{from{opacity:.5;transform:translateY(10px)}to{opacity:1;transform:none}}
.view.enter > *{animation:rise .5s var(--ease) both}
.view.enter > *:nth-child(2){animation-delay:.04s}.view.enter > *:nth-child(3){animation-delay:.08s}.view.enter > *:nth-child(4){animation-delay:.12s}.view.enter > *:nth-child(5){animation-delay:.16s}.view.enter > *:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:.35;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- type + cards ---------- */
.ttl{font-size:28px;font-weight:700;letter-spacing:-.025em;margin:4px 0 0;text-wrap:balance;line-height:1.15}
.lede{color:var(--fg2);margin:4px 0 0;max-width:68ch;font-size:15px}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 4px -6px}
.hd h2{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0}
.hd span{font-size:13px;color:var(--fg2)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0;transition:background .35s var(--ease)}
.card h3{margin:0 0 4px;font-size:17px;font-weight:600;letter-spacing:-.01em}
.card p{margin:0}
.muted{color:var(--fg2)}
.small{font-size:13px}
.label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--fg2)}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
.press{transition:transform .28s var(--spring),box-shadow .2s;cursor:pointer}
.press:active{transform:scale(.97)}
@media (hover:hover){.press:hover{box-shadow:0 2px 4px rgba(0,0,0,.05),0 10px 28px rgba(0,0,0,.09)}}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .k{font-size:13px;color:var(--fg2);line-height:1.3}
.kpi .who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2);margin-top:auto;padding-top:6px;flex-wrap:wrap}

/* chips */
.conf{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;vertical-align:middle}
.conf::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.conf.f{color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent)}
.conf.r{color:var(--orange);background:color-mix(in srgb,var(--orange) 15%,transparent)}
.conf.e{color:var(--purple);background:color-mix(in srgb,var(--purple) 14%,transparent)}
.chip{display:inline-flex;align-items:center;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--fill);color:var(--fg);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.src{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--blue);font-weight:500}
.src svg{width:12px;height:12px;stroke-width:2}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.t-leader{color:var(--blue);background:color-mix(in srgb,var(--blue) 13%,transparent)}
.t-major{color:var(--teal);background:color-mix(in srgb,var(--teal) 14%,transparent)}
.t-rising{color:var(--pink);background:color-mix(in srgb,var(--pink) 13%,transparent)}
.t-niche{color:var(--brown);background:color-mix(in srgb,var(--brown) 15%,transparent)}

.av{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;letter-spacing:-.02em;flex:none}
.av.sm{width:28px;height:28px;border-radius:8px;font-size:12px}

/* ownership map */
.own{display:grid;gap:10px}
.ownrow{display:grid;grid-template-columns:minmax(92px,128px) 22px 1fr;align-items:center;gap:8px}
.owner{font-size:13px;font-weight:600;background:var(--fill);border-radius:10px;padding:8px 10px;text-align:center;line-height:1.25}
.owner small{display:block;font-weight:500;color:var(--fg2);font-size:12px}
.link{height:2px;background:var(--sep);position:relative}
.link::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left-color:var(--fg3);border-right:0}
.link.dash{background:repeating-linear-gradient(90deg,var(--fg3) 0 4px,transparent 4px 8px)}
.owned{display:flex;flex-wrap:wrap;gap:6px}
.owned span{font-size:13px;padding:5px 10px;border-radius:9px;background:var(--card2);border:.5px solid var(--sep);display:inline-flex;gap:6px;align-items:center}
.owned span i{width:8px;height:8px;border-radius:50%;flex:none}
.owned em{font-style:normal;font-size:12px;color:var(--fg2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg2);margin-top:10px;align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend .ln{width:22px;height:2px;background:var(--fg3)}
.legend .ln.dash{background:repeating-linear-gradient(90deg,var(--fg3) 0 4px,transparent 4px 8px)}

/* lists */
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:.5px solid var(--sep)}
.row:first-child{border-top:0;padding-top:2px}
.row:last-child{padding-bottom:0}
.row .body{min-width:0;flex:1}
.row .body b{font-weight:600}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.ico svg{width:17px;height:17px;stroke:#fff;stroke-width:2}

/* player cards */
.pc{display:flex;flex-direction:column;gap:10px}
.pc .top{display:flex;gap:12px;align-items:center}
.pc .top .nm{min-width:0;flex:1}
.pc .top .nm b{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em}
.pc .top .nm span{display:block;font-size:13px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .chev{color:var(--fg3)}
.pc p{font-size:14px;color:var(--fg2)}
.mini{display:flex;gap:3px;align-items:flex-end;height:22px}
.mini i{width:8px;border-radius:2px;background:var(--fill2);transition:height .5s var(--ease)}
.pc .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:.5px solid var(--sep);padding-top:10px}
.pc .foot .lbl{font-size:12px;color:var(--fg2)}

/* share bars */
.bars{display:flex;flex-direction:column;gap:14px}
.bar .lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;font-size:14px}
.bar .lab b{font-weight:600}
.bar .lab .num{font-variant-numeric:tabular-nums;font-weight:600}
.bar .lab .num small{font-weight:500;color:var(--fg2);font-size:12px}
.track{position:relative;height:14px;border-radius:7px;background:var(--fill);overflow:hidden}
.fillb{position:absolute;inset:0 auto 0 0;border-radius:7px;transform-origin:left;animation:grow .9s var(--ease) both}
.range{position:absolute;top:0;bottom:0;border-radius:7px;opacity:.35}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--fg3);margin-top:6px;font-variant-numeric:tabular-nums}

/* tables */
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;font-weight:600;color:var(--fg2);text-align:left;padding:8px 10px;letter-spacing:.02em;white-space:nowrap;border-bottom:.5px solid var(--sep)}
td{padding:10px;border-bottom:.5px solid var(--sep);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.mx th:first-child,.mx td:first-child{position:sticky;left:0;background:var(--card);z-index:1}
.mx td{text-align:center;padding:10px 6px}
.mx td:first-child{text-align:left;white-space:nowrap;font-weight:600}
.dots{display:inline-flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--fill2)}
.dots i.on{background:var(--c,var(--blue))}

/* filters */
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.filters::-webkit-scrollbar{display:none}
.fbtn{font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;background:var(--card);color:var(--fg);white-space:nowrap;box-shadow:var(--shadow);transition:transform .25s var(--spring),background .25s,color .25s}
.fbtn:active{transform:scale(.92)}
.fbtn.on{background:var(--blue);color:#fff}

/* feature cards */
.feat{display:flex;flex-direction:column;gap:6px}
.feat .who{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--fg2);font-weight:500}
.feat h4{margin:0;font-size:16px;font-weight:600}
.angle{margin-top:4px;font-size:13px;background:color-mix(in srgb,var(--blue) 9%,transparent);border-radius:10px;padding:8px 10px;color:var(--fg)}
.angle b{color:var(--blue);font-weight:600}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:calc(100% - 44px - env(safe-area-inset-top,0px));background:var(--bg);border-radius:14px 14px 0 0;
  transform:translateY(105%);transition:transform .5s var(--ease);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:7px auto 0;flex:none}
.sheet .sh{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));flex:none}
.sheet .sh .t{flex:1;min-width:0}
.sheet .sh .t b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em}
.sheet .sh .t span{display:block;font-size:13px;color:var(--fg2)}
.sheet .sb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;align-content:start}
.kv{display:grid;grid-template-columns:auto 1fr;gap:0}
.kv div{padding:10px 0;border-top:.5px solid var(--sep);font-size:14px}
.kv div:nth-child(-n+2){border-top:0;padding-top:0}
.kv div:nth-child(odd){color:var(--fg2);padding-right:14px;white-space:nowrap}
ul.b{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.spec{display:grid;gap:8px}
.spec .s{display:grid;grid-template-columns:86px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.spec .s .tr{height:8px;border-radius:4px;background:var(--fill)}
.spec .s .tr i{display:block;height:100%;border-radius:4px;transform-origin:left;animation:grow .8s var(--ease) both}
.spec .s em{font-style:normal;color:var(--fg2);font-size:12px}

/* settings */
.group{background:var(--card);border-radius:12px;overflow:hidden}
.gi{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:.5px solid var(--sep);min-height:48px}
.gi:first-child{border-top:0}
.gi .t{flex:1;font-size:16px}
.gi .t small{display:block;font-size:13px;color:var(--fg2)}
.switch{width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;transition:background .3s var(--ease);flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.1);transition:transform .35s var(--spring)}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.ghd{font-size:13px;color:var(--fg2);padding:0 14px 6px;text-transform:uppercase;letter-spacing:.03em}
.gft{font-size:13px;color:var(--fg2);padding:6px 14px 0}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,20px) scale(.96);opacity:0;background:var(--card);color:var(--fg);box-shadow:0 8px 30px rgba(0,0,0,.18);border-radius:999px;padding:10px 16px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;pointer-events:none;transition:transform .45s var(--spring),opacity .3s}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.toast svg{width:18px;height:18px;stroke:var(--green);stroke-width:2.4}

/* tour */
.tour{position:fixed;inset:0;z-index:70;pointer-events:none}
.tour.on{pointer-events:auto}
.spot{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.58);opacity:0;transition:all .5s var(--ease)}
.tour.on .spot{opacity:1}
.spot::after{content:"";position:absolute;inset:-5px;border-radius:18px;border:2px solid #fff;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.12)}}
.arrow{position:fixed;inset:0;width:100%;height:100%;overflow:visible}
.arrow path{stroke:#fff;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-dasharray:400;stroke-dashoffset:400;animation:draw .6s .15s var(--ease) forwards}
.arrow polygon{fill:#fff;opacity:0;animation:fadeIn .2s .6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeIn{to{opacity:1}}
.tip{position:fixed;width:min(320px,calc(100vw - 32px));max-width:calc(100vw - 32px);background:var(--card);color:var(--fg);border-radius:16px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.3);opacity:0;transform:translateY(8px) scale(.97);transition:opacity .35s,transform .45s var(--spring),left .5s var(--ease),top .5s var(--ease)}

/* collect every source key used in a market */
function marketSources(d){
  const keys=new Set();
  const walk=o=>{ if(!o||typeof o!=='object') return; if(Array.isArray(o)){o.forEach(walk);return}
    for(const [k,v] of Object.entries(o)){ if((k==='s'||k==='src')){ (Array.isArray(v)?v:[v]).forEach(x=>{if(SRC[x])keys.add(x)}) } else walk(v) } };
  walk(d); return [...keys];
}
function sourceList(keys){
  const by={}; keys.forEach(k=>{(by[SRC[k].k]=by[SRC[k].k]||[]).push(k)});
  return Object.keys(SRC_KIND).filter(k=>by[k]).map(k=>`<div class="sgrp"><div class="label">${SRC_KIND[k]}</div>${by[k].map(srow).join('')}</div>`).join('');
}

function srow(x){return `<a class="srow" href="${SRC[x].u}" target="_blank" rel="noopener"><span>${SRC[x].t}</span><small>${new URL(SRC[x].u).hostname.replace('www.','')}</small>${ic('ext')}${CHECK[x]?`<div class="cn">${chkPill(x)} ${CHECK[x][1]}</div>`:''}</a>`}
function openChecks(){
  const all=Object.keys(CHECK), cnt={ok:0,fix:0,part:0,lock:0,gone:0}; all.forEach(k=>cnt[CHECK[k][0]]++);
  const grp=(st,title,sub)=>{const ks=all.filter(k=>CHECK[k][0]===st);return ks.length?`<div class="card"><div class="label" style="margin-bottom:2px">${title} · ${ks.length}</div><p class="muted small" style="margin-bottom:8px">${sub}</p><div class="slist" style="margin-top:0">${ks.map(srow).join('')}</div></div>`:''};
  $('#sheetHead').innerHTML=`<div class="ico" style="background:var(--green)">${ic('shield')}</div><div class="t"><b>How we checked</b><span>${all.length} sources · checked ${CHECKED_ON}</span></div><button class="iconbtn" data-close aria-label="Close">${ic('x')}</button>`;
  $('#sheetBody').innerHTML=`
   <div class="ctiles">${['ok','fix','part','lock','gone'].map(k=>`<div class="ct s-${k}"><b>${cnt[k]}</b><span>${CHK_LBL[k]}</span></div>`).join('')}</div>
   <div class="card"><div class="label" style="margin-bottom:8px">What we did</div><ol class="steps">
     <li><b>Found sources.</b> Web searches for each market, keeping only pages that name a figure, date or deal.</li>
     <li><b>Opened every link.</b> All ${all.length} pages were opened, first by an automatic reader and, where a site blocked it, in a real browser. Paywalled pages were read as far as they allow.</li>
     <li><b>Compared claim by claim.</b> Every number, date and partnership on this dashboard was checked against the page text.</li>
     <li><b>Fixed or removed.</b> Wrong years, out-of-date numbers and claims not on the page were corrected or taken out. Background facts with no public link (for example owners and loyalty tiers) say “No public link found” so you know to check them.</li></ol>
     <p class="muted small" style="margin-top:10px">Status dots appear next to every source link: <i class="sd s-ok"></i>matches <i class="sd s-fix"></i>corrected <i class="sd s-part"></i>partly <i class="sd s-lock"></i>locked <i class="sd s-gone"></i>gone. Web-traffic pages (Semrush, Similarweb, Ahrefs) update monthly, so their numbers will drift.</p></div>
   ${grp('fix','Corrected','The source said something different, so we changed our figure or wording to match.')}
   ${grp('part','Partly matches','Main point confirmed; the part that was not on the page was removed or moved to another source.')}
   ${grp('lock','Locked','Paywalled or blocked to readers. Figures from these were dropped or marked Estimate.')}
   ${grp('gone','Page gone','No longer online. Figures removed.')}
   ${grp('ok','Matches','Page says what the dashboard says.')}`;
  showSheet();
}

/* ================= SHELL ================= */
function shell(){
  const tabsHTML = TABS.map(([k,l,i])=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}" aria-label="${l}">${ic(i)}<span>${l}</span></button>`).join('');
  $('#tabbar').innerHTML = tabsHTML;
  $('#side').innerHTML = `<div class="sbrand"><div class="logo"><svg class="i" viewBox="0 0 24 24">${P.globe}</svg></div><b>OTA Atlas</b></div>${tabsHTML}<div class="sfoot">Online travel agents across 10 Asian markets. Every figure links to its source.</div>`;
  $('#countries').innerHTML = `<div class="seg cseg" id="cseg" data-tour="country">${ORDER.map(([k,l])=>`<button data-c="${k}" aria-pressed="${S.c===k}">${l}</button>`).join('')}<span class="thumb"></span></div>`;
  requestAnimationFrame(()=>{placeThumb($('#cseg'), cIx()); scrollCountry(false)});
  $('#sub').textContent = `${D().name} · ${D().asOf}`;
}
function scrollCountry(smooth){
  const b=$('#cseg').querySelectorAll('button')[cIx()], wrap=$('#countries');
  if(b) wrap.scrollTo({left:b.offsetLeft-wrap.clientWidth/2+b.offsetWidth/2,behavior:smooth&&S.anim?'smooth':'auto'});
}
function placeThumb(seg,ix){
  if(!seg) return;
  const b=seg.querySelectorAll('button')[ix], t=seg.querySelector('.thumb');
  if(!b) return; t.style.width=b.offsetWidth+'px'; t.style.transform=`translateX(${b.offsetLeft-2}px)`;
  seg.querySelectorAll('button').forEach((x,i)=>x.style.color=i===ix?'var(--fg)':'var(--fg2)');
}

function miniBars(p){return `<div class="mini" aria-hidden="true">${SPEC_COLS.map(([k])=>`<i style="height:${4+p.spec[k]*6}px;${p.spec[k]?`background:${p.color}`:''}"></i>`).join('')}</div>`}
function vPlayers(){
  const d=D();
  return `<div><div class="label">${d.players.length} players tracked</div><h2 class="ttl">Players in ${d.name}</h2><p class="lede">Tap a card for owner, strengths, members, app features, partnerships and source links.</p></div>
  <div class="grid c2 c3w">${d.players.map((p,i)=>`<div class="card pc press" data-open="${p.id}" role="button" tabindex="0" ${i===0?'data-tour="card"':''}>
    <div class="top">${av(p)}<div class="nm"><b>${p.name}</b><span>${p.local}</span></div><span class="pill t-${p.tier}">${tierName[p.tier]}</span></div>
    <p>${p.one}</p>
    <div class="foot"><div><div class="lbl">Product range</div>${miniBars(p)}</div><span class="lbl" style="display:flex;align-items:center;gap:4px">${(p.src||[]).length?`${p.src.length} source${p.src.length>1?'s':''}`:'Official site'}<span class="chev">${ic('chev')}</span></span></div></div>`).join('')}</div>
  ${vCompareParts()}`;

function chartHTML(sh){
  if(sh.none) return `<div class="none">${ic('book')}<p>${sh.none}</p></div>`;
  if(sh.rank) return `<div class="list">${sh.rank.map((r,i)=>{const p=r.p&&pl(r.p);return `<div class="row" style="align-items:center"><div class="av sm" style="background:var(--fill2);color:var(--fg)">${i+1}</div>${p?av(p,1):'<div class="av sm" style="background:var(--fg3)"></div>'}<div class="body"><b>${r.b||r.n}</b>${p&&r.b!==p.name?` <span class="muted small">${p.name}</span>`:''}</div></div>`}).join('')}</div>`;
  const mx=sh.max, f=v=>`${v}${sh.sfx==='%'?'%':sh.sfx}`;
  return `<div class="bars">${sh.rows.map((r,i)=>{const p=r.p?pl(r.p):null, c=r.c||(p?p.color:'#8E8E93'), nm=r.label||(p?p.name:r.n);
    return `<div class="bar"><div class="lab"><b>${nm}</b><span class="num">${r.lo!=null?`${r.lo}–${r.hi}%`:f(r.v)} <small>${r.lo!=null?'est. range':(sh.sfx==='%'?'share':'')}</small></span></div>
    <div class="track">${r.lo!=null?`<div class="range" style="left:${r.lo/mx*100}%;width:${(r.hi-r.lo)/mx*100}%;background:${c}"></div>`:''}<div class="fillb" style="width:${Math.min(100,r.v/mx*100)}%;background:${c};animation-delay:${i*.07}s"></div></div></div>`}).join('')}</div>
    <div class="axis"><span>0</span><span>${f(mx/2)}</span><span>${f(mx)} · ${sh.axis}</span></div>`;
}
function vMarket(){

    <div class="card" data-tour="share">${seg}

function vCompareParts(){

  ${d.players.map(p=>`<tr><td><span class="press" data-open="${p.id}" role="button" tabindex="0" style="display:inline-flex;gap:8px;align-items:center">${av(p,1)}${p.name}</span></td>${SPEC_COLS.map(([k])=>`<td>${dots(p.spec[k],p.color)}</td>`).join('')}</tr>`).join('')}

const WHO=['Tourism board','Airport','Airline','Hotel group','Attraction'];
const GOALS=[['Awareness','Get known'],['Bookings','Sell trips'],['Data','Data & insights'],['Packages','Packages & stopovers'],['Events','Events & festivals']];
function allDeals(brand){const out=[];ORDER.forEach(([c])=>DATA[c].partners.forEach(x=>{if(BR(x.p)===brand)out.push({...x,c})}));return out}
function scorePlayers(){
  const f=EX.f, d=DATA[f.mk];
  const specW={'Tourism board':{f:2,h:2,a:2,p:1},'Airport':{f:3,gt:2,a:1,p:1},'Airline':{f:6,p:1},'Hotel group':{h:6,p:1},'Attraction':{a:6,ev:1}}[f.who];
  const typeFor={'Tourism board':'Tourism board','Airport':'Airport','Airline':'Airline','Hotel group':'Hotel','Attraction':'Tourism board'}[f.who];
  const kw={Awareness:/campaign|content|livestream|video|ranking|list|brand|co-brand/i,Bookings:/book|sale|deal|coupon|bundle|package/i,Data:/data|insight|intelligence|trend/i,Packages:/package|bundle|stopover|tour/i,Events:/event|concert|ticket|festival|show/i}[f.goal];
  return d.players.map(p=>{
    const r=[]; let sc={leader:40,major:28,rising:20,niche:8}[p.tier];
    r.push(`${tierName[p.tier]} in ${d.name}`);
    let fit=0; for(const k in specW) fit+=p.spec[k]*specW[k];
    if(f.goal==='Packages') fit+=p.spec.p*5; if(f.goal==='Events') fit+=p.spec.ev*6; if(f.goal==='Bookings') fit*=1.3;
    sc+=fit;
    const best=SPEC_COLS.filter(([k])=>specW[k]||(f.goal==='Events'&&k==='ev')||(f.goal==='Packages'&&k==='p')).sort((a,b)=>p.spec[b[0]]-p.spec[a[0]])[0];
    if(best&&p.spec[best[0]]>=2) r.push(`${p.spec[best[0]]===3?'Core strength':'Strong'} in ${best[1].toLowerCase()}`);
    const deals=allDeals(BR(p.id)).filter(x=>x.type===typeFor).filter((x,i,a)=>a.findIndex(y=>y.who===x.who)===i);
    if(deals.length){sc+=Math.min(24,deals.length*10); r.push(`Has worked with ${typeFor==='Hotel'?'hotels':typeFor.toLowerCase()+'s'}: ${deals.slice(0,2).map(x=>`${x.who} (${x.when})`).join('; ')}`)}
    const ft=p.feats.find(x=>kw.test(x.t+' '+x.d+' '+x.a));
    if(ft){sc+=12; r.push(`${ft.t}: ${ft.a}`)}
    if(f.goal==='Data'&&deals.some(x=>/data|insight|intelligence/i.test(x.what))){sc+=15;}
    return {p,sc,r,deal:deals[0]};
  }).sort((a,b)=>b.sc-a.sc);
}

  const t=e.target.closest('[data-tab],[data-c],[data-open],[data-close],[data-s],[data-pf],[data-theme-set],[data-tourstart],[data-checks],#animSw,#helpBtn,#setBtn,#chkBtn,#scrim');
  if(!t) return;
  if(t.dataset.tab){ if(S.tab!==t.dataset.tab){S.tab=t.dataset.tab;S.shareIx=0;save();render();window.scrollTo({top:0,behavior:S.anim?'smooth':'auto'});} }
  else if(t.dataset.c){ setCountry(t.dataset.c); }
  else if(t.dataset.open){ openPlayer(t.dataset.open); }
  else if(t.hasAttribute('data-close')||t.id==='scrim'){ hideSheet(); }
  else if(t.dataset.s!=null){ S.shareIx=+t.dataset.s; render(false); }
  else if(t.dataset.pf){ S.pf=t.dataset.pf; document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('on',b.dataset.pf===S.pf)); const pl_=$('#plist'); pl_.innerHTML=partnerRows(); if(S.anim){pl_.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:320,easing:'cubic-bezier(.32,.72,0,1)'})} }
  else if(t.dataset.themeSet){ S.theme=t.dataset.themeSet; save(); applyTheme(); placeThumb($('#tseg'),['light','dark','auto'].indexOf(S.theme)); placeThumb($('#cseg'),cIx()); toast(`Appearance: ${t.textContent}`); }
  else if(t.id==='animSw'){ S.anim=!S.anim; save(); t.setAttribute('aria-checked',S.anim); setTimeout(applyTheme,S.anim?0:350); toast(S.anim?'Animations on':'Animations off'); }
  else if(t.id==='setBtn'){ openSettings(); }
  else if(t.id==='chkBtn'||t.hasAttribute('data-checks')){ openChecks(); }
  else if(t.id==='helpBtn'||t.hasAttribute('data-tourstart')){ hideSheet(); setTimeout(()=>tour.start(),S.anim?250:0); }
});
function exClick(t){
  const d=t.dataset;
  if(d.goex){ S.tab='explore'; S.ex=d.goex; save(); render(); window.scrollTo({top:0,behavior:S.anim?'smooth':'auto'}); return true; }
  if(d.ex){ if(S.ex!==d.ex){S.ex=d.ex; save(); exRender(true);} return true; }
  if(d.mm){ if(EX.mode!==d.mm){EX.mode=d.mm; exRender(true);} return true; }
  if(d.mc!==undefined){
    if(EX.mode==='foot'){ const b=brandIndex().find(x=>x.id===EX.brand), m=b&&b.mk.find(x=>x.c===d.mc); if(m){ setCountry(m.c); openPlayer(m.pid);} return true; }
    EX.sel=d.mc||null; paintMap(false); if(EX.sel&&innerWidth<900){ const pnl=$('#mpanel'); pnl&&pnl.scrollIntoView({block:'nearest',behavior:S.anim?'smooth':'auto'}); } return true; }
  if(d.br){ EX.brand=d.br; document.querySelectorAll('.bchip').forEach(x=>x.classList.toggle('on',x.dataset.br===d.br)); paintMap(true); return true; }
  if(d.goc){ setCountry(d.goc); if(d.gop) openPlayer(d.gop); else { S.tab='overview'; save(); render(); window.scrollTo({top:0}); } return true; }
  if(d.fmk){ EX.f.mk=d.fmk; S.ex='find'; save(); exRender(true); return true; }
  if(d.cmk){ EX.c.mk=d.cmk; S.ex='cmp'; save(); exRender(S.ex!=='cmp'); return true; }
  if(d.cab){ const [mk,a,b]=d.cab.split('|'); EX.c={mk,a,b}; S.ex='cmp'; save(); exRender(true); window.scrollTo({top:0,behavior:S.anim?'smooth':'auto'}); return true; }
  if(d.fq){ EX.f[d.fq]=d.fv; const y=window.scrollY; exRender(false); window.scrollTo(0,y); const fr=$('#fres'); if(fr&&S.anim) fr.querySelectorAll('.fr').forEach((el,i)=>el.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:320,delay:i*60,easing:'cubic-bezier(.32,.72,0,1)',fill:'backwards'})); return true; }
  if(t.hasAttribute('data-swap')){ const a=EX.c.a; EX.c.a=EX.c.b; EX.c.b=a; exRender(false); if(S.anim) document.querySelectorAll('.ch').forEach(el=>el.animate([{transform:'scale(.94)'},{transform:'none'}],{duration:300,easing:'cubic-bezier(.34,1.4,.64,1)'})); return true; }
  return false;
}
document.addEventListener('change',e=>{ const s_=e.target.closest('[data-cs]'); if(!s_) return; EX.c[s_.dataset.cs]=s_.value; if(EX.c.a===EX.c.b){ const o=D().players.find(p=>p.id!==EX.c.a); if(s_.dataset.cs==='a') EX.c.b=o.id; else EX.c.a=o.id; } exRender(false); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(tour.on) tour.end(); else hideSheet(); }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open][role="button"]')){e.preventDefault();openPlayer(e.target.dataset.open)}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-c]')){e.preventDefault();setCountry(e.target.dataset.c)}
});
(()=>{let y0=null,dy=0;const sh=$('#sheet');
  sh.addEventListener('touchstart',e=>{if($('#sheetBody').scrollTop>0&&!e.target.closest('.sh,.grab'))return;y0=e.touches[0].clientY;dy=0},{passive:true});
  sh.addEventListener('touchmove',e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);if(innerWidth<900&&dy>0){sh.style.transition='none';sh.style.transform=`translateY(${dy}px)`}},{passive:true});
  sh.addEventListener('touchend',()=>{if(y0==null)return;sh.style.transition='';sh.style.transform='';if(dy>110)hideSheet();y0=null});
})();

/* ================= HELP TOUR ================= */
const tour={on:false,i:0,
  steps:[
    {sel:'[data-tour="country"]',t:'Pick a market',d:'Ten markets: China, Japan, Korea, Taiwan, Hong Kong, Indonesia, Vietnam, Philippines, Thailand, Malaysia. Swipe sideways for more.'},
    {sel:'[data-tour="tabs"]',t:'Sections',d:'Overview, Players (with strengths and app features), Market (share and users), Partners and Explore.'},
    {sel:'[data-tour="all"]',tab:'overview',t:'All markets at a glance',d:'Leaders, local champions and rising players for every market. Tap a row to jump there.'},
    {sel:'[data-tour="card"]',tab:'players',t:'Player cards',d:'Tier and product range. Tap one for the full profile and its “Verify” links.'},
    {sel:'[data-tour="share"]',tab:'market',t:'Market share',d:'Switch between measures. Each chart says what it counts, how sure it is, and links to its source.'},
    {sel:'[data-tour="sources"]',tab:'market',t:'All sources',d:'Every link for this market with a coloured dot and a note on what we found when we checked it.'},
    {sel:'[data-tour="matrix"]',tab:'players',t:'Specialism matrix',d:'Dots show what each OTA is strong in, from flights to pay-later. Scroll sideways on a phone.'},
    {sel:'[data-tour="filters"]',tab:'partners',t:'Partner filters',d:'Show only tourism boards, airports, airlines, hotels or payment partners.'},
    {sel:'[data-tour="explore"]',tab:'explore',t:'Explore',d:'Map of all 10 markets, a partner finder and a side-by-side compare.'},
    {sel:'[data-tour="map"]',tab:'explore',ex:'map',t:'Footprint map',d:'Tap a market for its leaders, or switch to OTA footprint to see where each OTA plays, with lines from its home city.'},
    {sel:'[data-tour="checks"]',t:'How we checked',d:'Every source was opened and compared. See what matched, what we corrected and what is locked behind paywalls.'},
    {sel:'[data-tour="settings"]',t:'Settings',d:'Light, Dark or Auto appearance, and the animations switch.'},
    {sel:'[data-tour="help"]',t:'This guide',d:'Tap the question mark any time to see this again.'}
  ],
  start(){this.on=true;this.i=0;this.prevTab=S.tab;$('#tour').classList.add('on');this.show()},
  end(){this.on=false;$('#tour').classList.remove('on');$('#arrow').innerHTML='';if(S.tab!==this.prevTab){S.tab=this.prevTab;render()}},
  target(sel){return [...document.querySelectorAll(sel)].find(el=>el.getClientRects().length&&getComputedStyle(el).display!=='none')},
  show(){
    const st=this.steps[this.i];
    const go=()=>{
      let el=this.target(st.sel); if(!el){this.next();return}
      const rr=el.getBoundingClientRect();
      if(rr.top<60||rr.bottom>innerHeight-90){el.scrollIntoView({block:rr.height>innerHeight*.6?'start':'center',behavior:'auto'})}
      requestAnimationFrame(()=>this.place(el,st));
    };
    if(st.ex&&S.ex!==st.ex){S.ex=st.ex; if(S.tab===st.tab){exRender(false); setTimeout(go,120); return;}}
    if(st.tab&&S.tab!==st.tab){S.tab=st.tab;render(false);setTimeout(go,120)} else go();
  },
  place(el,st){
    const r=el.getBoundingClientRect(),pad=6,spot=$('#spot');
    const box={l:Math.max(4,r.left-pad),t:Math.max(4,r.top-pad),w:Math.min(r.width+pad*2,innerWidth-8),h:Math.min(r.height+pad*2,innerHeight-8-Math.max(4,r.top-pad))};
    Object.assign(spot.style,{left:box.l+'px',top:box.t+'px',width:box.w+'px',height:box.h+'px'});
    const tip=$('#tip'),n=this.steps.length;
    tip.innerHTML=`<div class="step">Step ${this.i+1} of ${n}</div><b>${st.t}</b><p>${st.d}</p><div class="acts"><span class="dots">${this.steps.map((_,k)=>`<i class="${k===this.i?'on':''}"></i>`).join('')}</span><span style="display:flex;gap:8px">${this.i?'<button class="btn g" data-tb>Back</button>':'<button class="btn g" data-te>Skip</button>'}<button class="btn" data-tn>${this.i===n-1?'Done':'Next'}</button></span></div>`;
    const tw=tip.offsetWidth,th=tip.offsetHeight,gap=56;
    const below=box.t+box.h+gap+th<innerHeight-10, above=box.t-gap-th>10;
    let top,left;
    if(below) top=box.t+box.h+gap; else if(above) top=box.t-gap-th; else top=Math.max(10,Math.min(innerHeight-th-10,box.t+box.h/2-th/2));
    const sideMode=!below&&!above;
    if(sideMode){ const g2=28, rs=innerWidth-(box.l+box.w), ls=box.l; left=rs>=ls?Math.min(innerWidth-tw-10,box.l+box.w+g2):Math.max(10,box.l-g2-tw); }
    else left=Math.max(12,Math.min(innerWidth-tw-12,box.l+box.w/2-tw/2));
    Object.assign(tip.style,{left:left+'px',top:top+'px'});
    const cx=box.l+box.w/2;
    let sx,sy,ex,ey;
    if(sideMode){ const toRight=left>cx; sx=toRight?left:left+tw; sy=top+28; ex=toRight?box.l+box.w+6:box.l-6; ey=Math.max(box.t+8,Math.min(box.t+box.h-8,sy)); }
    else if(below){ sx=Math.max(left+24,Math.min(left+tw-24,cx)); sy=top; ex=Math.max(box.l+12,Math.min(box.l+box.w-12,sx+(cx-sx)*.5)); ey=box.t+box.h+8; }
    else { sx=Math.max(left+24,Math.min(left+tw-24,cx)); sy=top+th; ex=Math.max(box.l+12,Math.min(box.l+box.w-12,sx+(cx-sx)*.5)); ey=box.t-8; }
    const mx=(sx+ex)/2+(sideMode?0:28), my=(sy+ey)/2+(sideMode?-24:0);
    const ang=Math.atan2(ey-my,ex-mx), a=10;
    const p1=[ex-a*Math.cos(ang-0.45),ey-a*Math.sin(ang-0.45)], p2=[ex-a*Math.cos(ang+0.45),ey-a*Math.sin(ang+0.45)];
    $('#arrow').innerHTML=`<path d="M${sx},${sy} Q${mx},${my} ${ex},${ey}"/><polygon points="${ex},${ey} ${p1.join(',')} ${p2.join(',')}"/>`;
  },
  next(){ if(this.i<this.steps.length-1){this.i++;this.show()} else {this.end();toast('Guide finished')} },
  back(){ if(this.i>0){this.i--;this.show()} }
};
$('#tour').addEventListener('click',e=>{
  if(e.target.closest('[data-tn]')) tour.next();
  else if(e.target.closest('[data-tb]')) tour.back();
  else if(e.target.closest('[data-te]')) tour.end();
});
addEventListener('resize',()=>{const mb=$('#mapbox'); if(mb) mb.classList.toggle('narrow',mb.clientWidth<640);placeThumb($('#cseg'),cIx());const ss=$('#sseg');if(ss)placeThumb(ss,S.shareIx);if(tour.on)tour.show()});

/* ================= BOOT ================= */
applyTheme(); shell(); render();

</script>
